# Andeus Group — nginx inside the container, the equivalent of public/.htaccess.
# TLS and the canonical host are handled by Traefik/Cloudflare upstream, so
# nothing here forces https or a domain (that would loop). Redirects are
# relative (absolute_redirect off) so they never point at http://.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;
    autoindex off;

    # Unknown URLs get a real 404 with the prerendered page.
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json application/ld+json application/xml image/svg+xml;

    # Everything is prerendered: files are served as-is, folders through their
    # index.html (/servicios -> 301 /servicios/). No general SPA fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    # Retired section.
    location ~ ^/industrias/?$ { return 301 /; }

    # Blog posts published after the last build have no folder yet: they get
    # the trailing slash, then the client-rendered shell. Prerendered posts are
    # real folders and are served from them.
    location ~ ^/blog/([a-z0-9-]+)$ { return 301 /blog/$1/; }
    location ~ ^/blog/[a-z0-9-]+/$ {
        try_files $uri $uri/ /blog-shell.html;
    }

    # The shell is only served through the rule above, never at its own URL.
    location = /blog-shell.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Vite assets carry a content hash in the file name: one year, immutable.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML always revalidates so a deploy shows up at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Photos and logo keep their names between deploys: one month.
    location ~* \.(webp|avif|png|jpe?g|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
